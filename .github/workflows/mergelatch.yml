name: MergeLatch external consumer trial

# Only inert files are scanned; none of the fixture workflows are executed.
# This is a disposable advisory trial, not a required security gate.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  external-consumer:
    name: SHA-pinned advisory consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the real consumer repository
        id: repository
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275

      - name: Scan the inert clean fixture
        id: clean
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: fixtures/clean

      - name: Scan the inert write-all fixture
        id: finding
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: fixtures/finding

      - name: Scan the inert malformed fixture
        id: incomplete
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: fixtures/incomplete

      # These two directories contain only inert copies of the existing fixtures.
      # A .git file indicates a nested checkout with no readable revision, so
      # D-2 must fail closed instead of borrowing the parent's merge revision.
      - name: Create inert nested checkouts with unreadable revisions
        run: |
          set -euo pipefail
          mkdir trial-unverified-clean trial-unverified-finding
          cp -R fixtures/clean/.github trial-unverified-clean/.github
          cp -R fixtures/finding/.github trial-unverified-finding/.github
          for dir in trial-unverified-clean trial-unverified-finding; do
            printf 'gitdir: ../not-present\n' > "${dir}/.git"
          done

      - name: Scan a nested clean fixture with unavailable revision (expected failure)
        id: unverified_clean
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: trial-unverified-clean

      - name: Scan a nested finding fixture with unavailable revision (expected failure)
        id: unverified_finding
        continue-on-error: true
        uses: MergeLatch/mergelatch@c5296cef5fd3ffc36f1b8f0649e6491050606275
        with:
          scan-directory: trial-unverified-finding

      - name: Assert that advisory outcomes and Action provenance match
        env:
          EXPECTED_ACTION_SHA: c5296cef5fd3ffc36f1b8f0649e6491050606275
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          REPO_STATUS: ${{ steps.repository.outputs.status }}
          REPO_EXIT: ${{ steps.repository.outputs.scanner-exit-code }}
          REPO_SOURCE: ${{ steps.repository.outputs.scanner-source }}
          REPO_PINNED: ${{ steps.repository.outputs.action-pinned }}
          REPO_ACTION_REVISION: ${{ steps.repository.outputs.action-revision }}
          REPO_REVISION_CHECK: ${{ steps.repository.outputs.revision-check }}
          REPO_SCANNED_REVISION: ${{ steps.repository.outputs.scanned-revision }}
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
          CLEAN_EXIT: ${{ steps.clean.outputs.scanner-exit-code }}
          CLEAN_SOURCE: ${{ steps.clean.outputs.scanner-source }}
          CLEAN_ACTION_REVISION: ${{ steps.clean.outputs.action-revision }}
          FINDING_STATUS: ${{ steps.finding.outputs.status }}
          FINDING_EXIT: ${{ steps.finding.outputs.scanner-exit-code }}
          FINDING_COUNT: ${{ steps.finding.outputs.findings-count }}
          FINDING_OUTCOME: ${{ steps.finding.outcome }}
          FINDING_SOURCE: ${{ steps.finding.outputs.scanner-source }}
          FINDING_ACTION_REVISION: ${{ steps.finding.outputs.action-revision }}
          INCOMPLETE_STATUS: ${{ steps.incomplete.outputs.status }}
          INCOMPLETE_EXIT: ${{ steps.incomplete.outputs.scanner-exit-code }}
          INCOMPLETE_COUNT: ${{ steps.incomplete.outputs.incomplete-count }}
          INCOMPLETE_OUTCOME: ${{ steps.incomplete.outcome }}
          INCOMPLETE_SOURCE: ${{ steps.incomplete.outputs.scanner-source }}
          INCOMPLETE_ACTION_REVISION: ${{ steps.incomplete.outputs.action-revision }}
          CLEAN_REVISION_CHECK: ${{ steps.clean.outputs.revision-check }}
          FINDING_REVISION_CHECK: ${{ steps.finding.outputs.revision-check }}
          INCOMPLETE_REVISION_CHECK: ${{ steps.incomplete.outputs.revision-check }}
          UNVERIFIED_CLEAN_OUTCOME: ${{ steps.unverified_clean.outcome }}
          UNVERIFIED_CLEAN_STATUS: ${{ steps.unverified_clean.outputs.status }}
          UNVERIFIED_CLEAN_REVISION: ${{ steps.unverified_clean.outputs.scanned-revision }}
          UNVERIFIED_CLEAN_CHECK: ${{ steps.unverified_clean.outputs.revision-check }}
          UNVERIFIED_CLEAN_SOURCE: ${{ steps.unverified_clean.outputs.scanner-source }}
          UNVERIFIED_CLEAN_PINNED: ${{ steps.unverified_clean.outputs.action-pinned }}
          UNVERIFIED_CLEAN_ACTION_SHA: ${{ steps.unverified_clean.outputs.action-revision }}
          UNVERIFIED_FINDING_OUTCOME: ${{ steps.unverified_finding.outcome }}
          UNVERIFIED_FINDING_STATUS: ${{ steps.unverified_finding.outputs.status }}
          UNVERIFIED_FINDING_CHECK: ${{ steps.unverified_finding.outputs.revision-check }}
          UNVERIFIED_FINDING_REVISION: ${{ steps.unverified_finding.outputs.scanned-revision }}
          UNVERIFIED_FINDING_COUNT: ${{ steps.unverified_finding.outputs.findings-count }}
          UNVERIFIED_FINDING_SOURCE: ${{ steps.unverified_finding.outputs.scanner-source }}
          UNVERIFIED_FINDING_ACTION_SHA: ${{ steps.unverified_finding.outputs.action-revision }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=External consumer trial::$1"; exit 1; }
          [ "${REPO_STATUS}" = clean ] || fail "consumer checkout was not clean"
          [ "${REPO_EXIT}" = 0 ] || fail "consumer checkout scanner exit was not 0"
          [ "${REPO_REVISION_CHECK}" = matches-merge ] || fail "consumer revision did not match the PR merge commit"
          [ "${REPO_SCANNED_REVISION}" = "${EXPECTED_MERGE_SHA}" ] || fail "wrong merge revision scanned"
          [ "${REPO_PINNED}" = true ] || fail "Action was not full-SHA pinned"
          [ "${CLEAN_STATUS}" = clean ] || fail "inert clean fixture was not clean"
          [ "${CLEAN_EXIT}" = 0 ] || fail "clean fixture scanner exit was not 0"
          [ "${FINDING_STATUS}" = findings ] || fail "write-all fixture did not report findings"
          [ "${FINDING_EXIT}" = 1 ] || fail "finding scanner exit was not 1"
          [ "${FINDING_COUNT}" = 1 ] || fail "finding count was not 1"
          [ "${FINDING_OUTCOME}" = success ] || fail "advisory findings step was not green"
          [ "${INCOMPLETE_STATUS}" = incomplete ] || fail "malformed fixture was not incomplete"
          [ "${INCOMPLETE_EXIT}" = 2 ] || fail "incomplete scanner exit was not 2"
          [ "${INCOMPLETE_COUNT}" = 1 ] || fail "incomplete count was not 1"
          [ "${INCOMPLETE_OUTCOME}" = success ] || fail "advisory incomplete step was not green"
          for source in "${REPO_SOURCE}" "${CLEAN_SOURCE}" "${FINDING_SOURCE}" "${INCOMPLETE_SOURCE}"; do
            [ "${source}" = action-checkout ] || fail "scanner was not loaded from the separate Action checkout"
          done
          for revision in "${REPO_ACTION_REVISION}" "${CLEAN_ACTION_REVISION}" "${FINDING_ACTION_REVISION}" "${INCOMPLETE_ACTION_REVISION}"; do
            [ "${revision}" = "${EXPECTED_ACTION_SHA}" ] || fail "Action revision did not match the reviewed full commit SHA"
          done
          # D-2: Ordinary fixture subdirectories inherit the verified merge checkout.
          for check in "${CLEAN_REVISION_CHECK}" "${FINDING_REVISION_CHECK}" "${INCOMPLETE_REVISION_CHECK}"; do
            [ "${check}" = matches-merge ] || fail "ordinary fixture subdirectory revision not verified"
          done

          # Both Action steps must FAIL. Their job passes only after validating the expected failures.
          [ "${UNVERIFIED_CLEAN_OUTCOME}" = failure ] || fail "unverified clean Action step did not fail"
          [ "${UNVERIFIED_CLEAN_STATUS}" = error ] || fail "unverified clean scan did not report error"
          [ "${UNVERIFIED_CLEAN_CHECK}" = unavailable ] || fail "unverified clean scan was not unavailable"
          [ -z "${UNVERIFIED_CLEAN_REVISION}" ] || fail "unverified clean scan reported a revision"
          [ "${UNVERIFIED_CLEAN_SOURCE}" = action-checkout ] || fail "unverified clean scan source changed"
          [ "${UNVERIFIED_CLEAN_PINNED}" = true ] || fail "unverified clean Action was not SHA-pinned"
          [ "${UNVERIFIED_CLEAN_ACTION_SHA}" = "${EXPECTED_ACTION_SHA}" ] || fail "unverified clean Action SHA changed"
          [ "${UNVERIFIED_FINDING_OUTCOME}" = failure ] || fail "unverified finding Action step did not fail"
          [ "${UNVERIFIED_FINDING_STATUS}" = error ] || fail "finding concealed an unavailable revision"
          [ "${UNVERIFIED_FINDING_CHECK}" = unavailable ] || fail "unverified finding scan was not unavailable"
          [ -z "${UNVERIFIED_FINDING_REVISION}" ] || fail "unverified finding scan reported a revision"
          [ "${UNVERIFIED_FINDING_COUNT}" = 1 ] || fail "unverified finding was not preserved in count"
          [ "${UNVERIFIED_FINDING_SOURCE}" = action-checkout ] || fail "unverified finding source changed"
          [ "${UNVERIFIED_FINDING_ACTION_SHA}" = "${EXPECTED_ACTION_SHA}" ] || fail "unverified finding Action SHA changed"

          echo "External consumer D-2 assertions passed. Expected Action failures were verified; findings and incomplete scans remain advisory."

      # F-08. The helper is loaded from the downloaded, hash-verified Action directory and its real
      # build() is run against FAKE rustup, rustc and cargo, with a 2 second timeout. No real build runs.
      # The fake cargo starts a child and a grandchild (sleep 3607) so this checks that a timeout stops
      # the whole process tree. It does not test, and the Action does not claim to stop, a process that
      # starts its own session. The test script cleans up after itself even when it fails early: it finds
      # its fake processes by their working directory, not only by PIDs it collected.
      - name: Consumer verify F-08 process-tree timeout (pinned Action helper)
        env:
          ACTION_SHA: c5296cef5fd3ffc36f1b8f0649e6491050606275
          HELPER_SHA256: 6d6620ad6f69056684bb0c8265caf03829a6074e78f5a07efed39ba8935d1970
        run: |
          set -euo pipefail
          fail() { echo "::error title=Trial::$1"; exit 1; }
          action_dir="$(cd "${RUNNER_WORKSPACE}/../_actions/MergeLatch/mergelatch/${ACTION_SHA}" && pwd -P)"
          script="${RUNNER_TEMP}/f08_trial.py"
          cat > "${script}" <<'PY'
          import glob, hashlib, importlib.util, os, shutil, signal, stat, subprocess, sys, tempfile, time

          action_dir = os.environ["ACTION_DIR"]
          helper_path = os.path.join(action_dir, "action", "mergelatch_action.py")
          with open(helper_path, "rb") as handle:
              if hashlib.sha256(handle.read()).hexdigest() != os.environ["HELPER_SHA256"]:
                  sys.exit("the helper under test is not the verified file")
          spec = importlib.util.spec_from_file_location("pinned_helper", helper_path)
          mla = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mla)

          root = tempfile.mkdtemp(prefix="f08-")
          real_root = os.path.realpath(root)
          pids = {}


          def reap_everything():
              """Best-effort cleanup that does not depend on the test having collected any PID.

              Every fake process runs with its working directory inside this test's own temporary
              directory (the build starts there and its descendants inherit it), so they are found by
              that, as well as by the marker files the fake cargo writes. A marker PID is only killed
              if it still looks like one of ours. Nothing here may hide the error being handled."""
              victims = set(pids.values())
              for marker in glob.glob(os.path.join(root, "*.cargo")) + glob.glob(os.path.join(root, "*.child"))             + glob.glob(os.path.join(root, "*.grandchild")):
                  try:
                      with open(marker) as handle:
                          pid = int(handle.read().split()[0])
                      with open("/proc/%d/cmdline" % pid, "rb") as handle:
                          cmdline = handle.read().replace(b"\x00", b" ").decode("ascii", "replace")
                      if "sleep 3607" in cmdline or real_root in cmdline:
                          victims.add(pid)
                  except (OSError, ValueError, IndexError):
                      pass
              for entry in os.listdir("/proc"):
                  if entry.isdigit() and int(entry) != os.getpid():
                      try:
                          if os.path.realpath(os.readlink("/proc/%s/cwd" % entry)).startswith(real_root + os.sep):
                              victims.add(int(entry))
                      except OSError:
                          pass
              victims.discard(os.getpid())
              for pid in victims:
                  try:
                      os.kill(pid, signal.SIGKILL)
                  except OSError:
                      pass


          def alive(pid):
              try:
                  os.kill(pid, 0)
                  with open("/proc/%d/stat" % pid) as handle:
                      return handle.read().rsplit(")", 1)[1].split()[0] != "Z"
              except OSError:
                  return False


          def fake(path, body):
              with open(path, "w") as handle:
                  handle.write("#!/bin/sh\n" + body)
              os.chmod(path, os.stat(path).st_mode | stat.S_IXUSR)


          def fail(message):
              print("F-08 trial FAILED: " + message)
              raise SystemExit(1)


          def setup(name, cargo_body):
              home = os.path.join(root, name, "home")
              cargo_bin = os.path.join(home, ".cargo", "bin")
              os.makedirs(cargo_bin)
              fake(os.path.join(cargo_bin, "rustup"), "exit 0\n")
              fake(os.path.join(cargo_bin, "rustc"), "echo rustc fake\n")
              fake(os.path.join(cargo_bin, "cargo"), cargo_body)
              action_root = os.path.join(root, name, "action")
              state = os.path.join(root, name, "state")
              os.makedirs(action_root)
              os.makedirs(state)
              env = {"RUNNER_TEMP": os.path.join(root, name), "MLA_ACTION_ROOT": action_root, "MLA_STATE_DIR": state}
              return home, env, state


          if os.environ.get("F08_INJECT_EARLY_FAILURE") == "1":
              # Cleanup probe. Start the real fake process tree, then fail BEFORE any PID has been
              # collected, as an unexpected error inside build() or an early file error would. The
              # caller expects this run to fail and then checks that nothing was left running.
              def start_then_fail(argv, cwd, env, timeout):
                  subprocess.Popen(argv, cwd=cwd, env=env, stdin=subprocess.DEVNULL, start_new_session=True)
                  time.sleep(1.5)
                  raise RuntimeError("injected early failure")
              mla.run_build_process = start_then_fail

          try:
              # 1. A timed-out build: cargo, its child and its grandchild must all be stopped.
              marker = os.path.join(root, "tree")
              home, env, state = setup("timeout", (
                  "sleep 3607 &\necho $! > %(m)s.child\n"
                  "( sleep 3607 & echo $! > %(m)s.grandchild; wait ) &\n"
                  "echo $$ > %(m)s.cargo\nwait\n") % {"m": marker})
              mla.BUILD_TIMEOUT_SECONDS = 2
              started = time.monotonic()
              try:
                  mla.build(env, home=home)
              except mla.ActionError as error:
                  message = str(error)
              else:
                  fail("a timed-out build did not raise an error")
              elapsed = time.monotonic() - started
              if "exceeded its time limit" not in message:
                  fail("unexpected timeout message: " + message)
              if elapsed > 30:
                  fail("the timeout took too long (%.1f s)" % elapsed)
              for name in ("cargo", "child", "grandchild"):
                  with open("%s.%s" % (marker, name)) as handle:
                      pids[name] = int(handle.read().split()[0])
              deadline = time.monotonic() + 5
              while any(alive(pid) for pid in pids.values()) and time.monotonic() < deadline:
                  time.sleep(0.05)
              still = [name for name, pid in pids.items() if alive(pid)]
              if still:
                  fail("processes still running after the timeout: " + ", ".join(still))
              try:
                  os.waitpid(-1, os.WNOHANG)
              except ChildProcessError:
                  pass
              else:
                  fail("an unreaped child process was left behind")
              if os.path.exists(os.path.join(state, "binary-path.txt")):
                  fail("a timed-out build left a binary path")
              print("timeout: error raised after %.1f s; cargo, child and grandchild stopped; script reaped" % elapsed)

              # 2. The build runs in its own session and process group.
              home, env, state = setup("group", "awk '{print $5, $6}' /proc/$$/stat > %s.groups\n" % marker)
              mla.BUILD_TIMEOUT_SECONDS = 60
              if mla.build(env, home=home) != 0:
                  fail("the group probe build did not finish")
              with open(marker + ".groups") as handle:
                  pgrp, session = map(int, handle.read().split())
              if pgrp == os.getpgid(0) or session == os.getsid(0):
                  fail("the build shares this process's group or session")
              print("group: build ran in its own process group and session")

              # 3. Normal completion and exit codes are unchanged.
              for code in (0, 1, 101, 127):
                  home, env, state = setup("exit%d" % code, "exit %d\n" % code)
                  mla.BUILD_TIMEOUT_SECONDS = 60
                  got = mla.build(env, home=home)
                  wrote = os.path.exists(os.path.join(state, "binary-path.txt"))
                  if got != code or wrote != (code == 0):
                      fail("exit code %d: returned %r, binary path written: %r" % (code, got, wrote))
              print("exit codes 0, 1, 101, 127 returned exactly; binary path written only on success")
          finally:
              try:
                  reap_everything()
              except Exception as cleanup_error:  # never hide the error being handled
                  print("cleanup problem: %r" % (cleanup_error,))
              shutil.rmtree(root, ignore_errors=True)
          print("F-08 trial passed")
          PY
          ACTION_DIR="${action_dir}" /usr/bin/python3 -I "${script}"
          if pgrep -f "sleep 3607" > /dev/null; then fail "a fake build process is still running"; fi
          echo "No fake build process is left running."

          # Cleanup probe: the same script is made to fail BEFORE it has collected any process ID,
          # after the fake process tree has started. It must fail, and nothing may be left running.
          if ACTION_DIR="${action_dir}" F08_INJECT_EARLY_FAILURE=1 /usr/bin/python3 -I "${script}" > "${RUNNER_TEMP}/f08_probe.log" 2>&1; then
            fail "the cleanup probe was expected to fail"
          fi
          grep -q "RuntimeError: injected early failure" "${RUNNER_TEMP}/f08_probe.log" || fail "the probe failed for a different reason"
          sleep 1
          if pgrep -f "sleep 3607" > /dev/null; then fail "the cleanup probe left a fake build process running"; fi
          echo "Cleanup probe: failed early as intended and left no fake build process running."

      - name: Record the exact reviewed Action revision
        if: always()
        env:
          ACTION_SHA: c5296cef5fd3ffc36f1b8f0649e6491050606275
        run: |
          {
            echo "### MergeLatch external consumer trial"
            echo
            echo "Action source: \`MergeLatch/mergelatch@${ACTION_SHA}\`"
            echo
            echo "The checkout is a separate disposable consumer repository. Findings and incomplete scans remain advisory, never proof of safety or an enforcement gate."
          } >> "${GITHUB_STEP_SUMMARY}"
