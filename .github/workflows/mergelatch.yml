name: MergeLatch external consumer trial

# Only inert files are scanned; none of the fixture workflows are executed.
# This is a disposable advisory trial, not a required security gate.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  external-consumer:
    name: SHA-pinned advisory consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the real consumer repository
        id: repository
        uses: MergeLatch/mergelatch@95bad26bc731caa913861e95f75bf2c4de3dc6b4

      - name: Scan the inert clean fixture
        id: clean
        uses: MergeLatch/mergelatch@95bad26bc731caa913861e95f75bf2c4de3dc6b4
        with:
          scan-directory: fixtures/clean

      - name: Scan the inert write-all fixture
        id: finding
        uses: MergeLatch/mergelatch@95bad26bc731caa913861e95f75bf2c4de3dc6b4
        with:
          scan-directory: fixtures/finding

      - name: Scan the inert malformed fixture
        id: incomplete
        uses: MergeLatch/mergelatch@95bad26bc731caa913861e95f75bf2c4de3dc6b4
        with:
          scan-directory: fixtures/incomplete

      # These two directories contain only inert copies of the existing fixtures.
      # A .git file indicates a nested checkout with no readable revision, so
      # D-2 must fail closed instead of borrowing the parent's merge revision.
      - name: Create inert nested checkouts with unreadable revisions
        run: |
          set -euo pipefail
          mkdir trial-unverified-clean trial-unverified-finding
          cp -R fixtures/clean/.github trial-unverified-clean/.github
          cp -R fixtures/finding/.github trial-unverified-finding/.github
          for dir in trial-unverified-clean trial-unverified-finding; do
            printf 'gitdir: ../not-present\n' > "${dir}/.git"
          done

      - name: Scan a nested clean fixture with unavailable revision (expected failure)
        id: unverified_clean
        continue-on-error: true
        uses: MergeLatch/mergelatch@95bad26bc731caa913861e95f75bf2c4de3dc6b4
        with:
          scan-directory: trial-unverified-clean

      - name: Scan a nested finding fixture with unavailable revision (expected failure)
        id: unverified_finding
        continue-on-error: true
        uses: MergeLatch/mergelatch@95bad26bc731caa913861e95f75bf2c4de3dc6b4
        with:
          scan-directory: trial-unverified-finding

      - name: Assert that advisory outcomes and Action provenance match
        env:
          EXPECTED_ACTION_SHA: 95bad26bc731caa913861e95f75bf2c4de3dc6b4
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          REPO_STATUS: ${{ steps.repository.outputs.status }}
          REPO_EXIT: ${{ steps.repository.outputs.scanner-exit-code }}
          REPO_SOURCE: ${{ steps.repository.outputs.scanner-source }}
          REPO_PINNED: ${{ steps.repository.outputs.action-pinned }}
          REPO_ACTION_REVISION: ${{ steps.repository.outputs.action-revision }}
          REPO_REVISION_CHECK: ${{ steps.repository.outputs.revision-check }}
          REPO_SCANNED_REVISION: ${{ steps.repository.outputs.scanned-revision }}
          CLEAN_STATUS: ${{ steps.clean.outputs.status }}
          CLEAN_EXIT: ${{ steps.clean.outputs.scanner-exit-code }}
          CLEAN_SOURCE: ${{ steps.clean.outputs.scanner-source }}
          CLEAN_ACTION_REVISION: ${{ steps.clean.outputs.action-revision }}
          FINDING_STATUS: ${{ steps.finding.outputs.status }}
          FINDING_EXIT: ${{ steps.finding.outputs.scanner-exit-code }}
          FINDING_COUNT: ${{ steps.finding.outputs.findings-count }}
          FINDING_OUTCOME: ${{ steps.finding.outcome }}
          FINDING_SOURCE: ${{ steps.finding.outputs.scanner-source }}
          FINDING_ACTION_REVISION: ${{ steps.finding.outputs.action-revision }}
          INCOMPLETE_STATUS: ${{ steps.incomplete.outputs.status }}
          INCOMPLETE_EXIT: ${{ steps.incomplete.outputs.scanner-exit-code }}
          INCOMPLETE_COUNT: ${{ steps.incomplete.outputs.incomplete-count }}
          INCOMPLETE_OUTCOME: ${{ steps.incomplete.outcome }}
          INCOMPLETE_SOURCE: ${{ steps.incomplete.outputs.scanner-source }}
          INCOMPLETE_ACTION_REVISION: ${{ steps.incomplete.outputs.action-revision }}
          CLEAN_REVISION_CHECK: ${{ steps.clean.outputs.revision-check }}
          FINDING_REVISION_CHECK: ${{ steps.finding.outputs.revision-check }}
          INCOMPLETE_REVISION_CHECK: ${{ steps.incomplete.outputs.revision-check }}
          UNVERIFIED_CLEAN_OUTCOME: ${{ steps.unverified_clean.outcome }}
          UNVERIFIED_CLEAN_STATUS: ${{ steps.unverified_clean.outputs.status }}
          UNVERIFIED_CLEAN_REVISION: ${{ steps.unverified_clean.outputs.scanned-revision }}
          UNVERIFIED_CLEAN_CHECK: ${{ steps.unverified_clean.outputs.revision-check }}
          UNVERIFIED_CLEAN_SOURCE: ${{ steps.unverified_clean.outputs.scanner-source }}
          UNVERIFIED_CLEAN_PINNED: ${{ steps.unverified_clean.outputs.action-pinned }}
          UNVERIFIED_CLEAN_ACTION_SHA: ${{ steps.unverified_clean.outputs.action-revision }}
          UNVERIFIED_FINDING_OUTCOME: ${{ steps.unverified_finding.outcome }}
          UNVERIFIED_FINDING_STATUS: ${{ steps.unverified_finding.outputs.status }}
          UNVERIFIED_FINDING_CHECK: ${{ steps.unverified_finding.outputs.revision-check }}
          UNVERIFIED_FINDING_REVISION: ${{ steps.unverified_finding.outputs.scanned-revision }}
          UNVERIFIED_FINDING_COUNT: ${{ steps.unverified_finding.outputs.findings-count }}
          UNVERIFIED_FINDING_SOURCE: ${{ steps.unverified_finding.outputs.scanner-source }}
          UNVERIFIED_FINDING_ACTION_SHA: ${{ steps.unverified_finding.outputs.action-revision }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=External consumer trial::$1"; exit 1; }
          [ "${REPO_STATUS}" = clean ] || fail "consumer checkout was not clean"
          [ "${REPO_EXIT}" = 0 ] || fail "consumer checkout scanner exit was not 0"
          [ "${REPO_REVISION_CHECK}" = matches-merge ] || fail "consumer revision did not match the PR merge commit"
          [ "${REPO_SCANNED_REVISION}" = "${EXPECTED_MERGE_SHA}" ] || fail "wrong merge revision scanned"
          [ "${REPO_PINNED}" = true ] || fail "Action was not full-SHA pinned"
          [ "${CLEAN_STATUS}" = clean ] || fail "inert clean fixture was not clean"
          [ "${CLEAN_EXIT}" = 0 ] || fail "clean fixture scanner exit was not 0"
          [ "${FINDING_STATUS}" = findings ] || fail "write-all fixture did not report findings"
          [ "${FINDING_EXIT}" = 1 ] || fail "finding scanner exit was not 1"
          [ "${FINDING_COUNT}" = 1 ] || fail "finding count was not 1"
          [ "${FINDING_OUTCOME}" = success ] || fail "advisory findings step was not green"
          [ "${INCOMPLETE_STATUS}" = incomplete ] || fail "malformed fixture was not incomplete"
          [ "${INCOMPLETE_EXIT}" = 2 ] || fail "incomplete scanner exit was not 2"
          [ "${INCOMPLETE_COUNT}" = 1 ] || fail "incomplete count was not 1"
          [ "${INCOMPLETE_OUTCOME}" = success ] || fail "advisory incomplete step was not green"
          for source in "${REPO_SOURCE}" "${CLEAN_SOURCE}" "${FINDING_SOURCE}" "${INCOMPLETE_SOURCE}"; do
            [ "${source}" = action-checkout ] || fail "scanner was not loaded from the separate Action checkout"
          done
          for revision in "${REPO_ACTION_REVISION}" "${CLEAN_ACTION_REVISION}" "${FINDING_ACTION_REVISION}" "${INCOMPLETE_ACTION_REVISION}"; do
            [ "${revision}" = "${EXPECTED_ACTION_SHA}" ] || fail "Action revision did not match the reviewed full commit SHA"
          done
          # D-2: Ordinary fixture subdirectories inherit the verified merge checkout.
          for check in "${CLEAN_REVISION_CHECK}" "${FINDING_REVISION_CHECK}" "${INCOMPLETE_REVISION_CHECK}"; do
            [ "${check}" = matches-merge ] || fail "ordinary fixture subdirectory revision not verified"
          done

          # Both Action steps must FAIL. Their job passes only after validating the expected failures.
          [ "${UNVERIFIED_CLEAN_OUTCOME}" = failure ] || fail "unverified clean Action step did not fail"
          [ "${UNVERIFIED_CLEAN_STATUS}" = error ] || fail "unverified clean scan did not report error"
          [ "${UNVERIFIED_CLEAN_CHECK}" = unavailable ] || fail "unverified clean scan was not unavailable"
          [ -z "${UNVERIFIED_CLEAN_REVISION}" ] || fail "unverified clean scan reported a revision"
          [ "${UNVERIFIED_CLEAN_SOURCE}" = action-checkout ] || fail "unverified clean scan source changed"
          [ "${UNVERIFIED_CLEAN_PINNED}" = true ] || fail "unverified clean Action was not SHA-pinned"
          [ "${UNVERIFIED_CLEAN_ACTION_SHA}" = "${EXPECTED_ACTION_SHA}" ] || fail "unverified clean Action SHA changed"
          [ "${UNVERIFIED_FINDING_OUTCOME}" = failure ] || fail "unverified finding Action step did not fail"
          [ "${UNVERIFIED_FINDING_STATUS}" = error ] || fail "finding concealed an unavailable revision"
          [ "${UNVERIFIED_FINDING_CHECK}" = unavailable ] || fail "unverified finding scan was not unavailable"
          [ -z "${UNVERIFIED_FINDING_REVISION}" ] || fail "unverified finding scan reported a revision"
          [ "${UNVERIFIED_FINDING_COUNT}" = 1 ] || fail "unverified finding was not preserved in count"
          [ "${UNVERIFIED_FINDING_SOURCE}" = action-checkout ] || fail "unverified finding source changed"
          [ "${UNVERIFIED_FINDING_ACTION_SHA}" = "${EXPECTED_ACTION_SHA}" ] || fail "unverified finding Action SHA changed"

          echo "External consumer D-2 assertions passed. Expected Action failures were verified; findings and incomplete scans remain advisory."

      - name: Record the exact reviewed Action revision
        if: always()
        env:
          ACTION_SHA: 95bad26bc731caa913861e95f75bf2c4de3dc6b4
        run: |
          {
            echo "### MergeLatch external consumer trial"
            echo
            echo "Action source: \`MergeLatch/mergelatch@${ACTION_SHA}\`"
            echo
            echo "The checkout is a separate disposable consumer repository. Findings and incomplete scans remain advisory, never proof of safety or an enforcement gate."
          } >> "${GITHUB_STEP_SUMMARY}"
